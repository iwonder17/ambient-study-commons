<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Circle -->
  <circle cx="64" cy="64" r="58" fill="url(#bgGlow)" stroke="#10b981" stroke-width="3" filter="url(#dropShadow)" />
  <circle cx="64" cy="64" r="52" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 2" />

  <!-- Owl Body -->
  <ellipse cx="64" cy="72" rx="34" ry="34" fill="#1e293b" stroke="#334155" stroke-width="2" />

  <!-- Eyes Outer Glow -->
  <ellipse cx="48" cy="63" rx="13" ry="13" fill="url(#eyeGlow)" />
  <ellipse cx="80" cy="63" rx="13" ry="13" fill="url(#eyeGlow)" />

  <!-- Pupils -->
  <circle cx="50" cy="64" r="6" fill="#090d16" />
  <circle cx="78" cy="64" r="6" fill="#090d16" />

  <!-- Highlights -->
  <circle cx="48" cy="61" r="2.5" fill="#ffffff" />
  <circle cx="76" cy="61" r="2.5" fill="#ffffff" />

  <!-- Glasses Frame -->
  <circle cx="48" cy="63" r="14" fill="none" stroke="#38bdf8" stroke-width="2" />
  <circle cx="80" cy="63" r="14" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 62 63 L 66 63" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Beak -->
  <polygon points="64,72 58,80 70,80" fill="#f59e0b" />

  <!-- Graduation Cap -->
  <polygon points="64,22 100,34 64,44 28,34" fill="url(#capGrad)" stroke="#34d399" stroke-width="1.5" />
  <path d="M 64 34 L 92 46" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
  <circle cx="91" cy="46" r="3" fill="#fbbf24" />
</svg>

